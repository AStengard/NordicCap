<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicCap — Swedish Cap Table & VC Waterfall Engine</title>
    <meta
      name="description"
      content="Swedish corporate law (Aktiebolagslagen 2005:551) compliant equity & waterfall modeling platform for Nordic ventures and venture capital funds."
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214%22%20fill%3D%22%2315233E%22%2F%3E%3Crect%20x%3D%222.75%22%20y%3D%222.75%22%20width%3D%2258.5%22%20height%3D%2258.5%22%20rx%3D%2213.25%22%20stroke%3D%22%238C6D46%22%20stroke-opacity%3D%220.45%22%20stroke-width%3D%221.5%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%2237%22%20width%3D%228%22%20height%3D%2214%22%20rx%3D%221.5%22%20fill%3D%22%23F6F4EF%22%20fill-opacity%3D%220.45%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%2226%22%20width%3D%228%22%20height%3D%2225%22%20rx%3D%221.5%22%20fill%3D%22%23F6F4EF%22%20fill-opacity%3D%220.82%22%2F%3E%3Crect%20x%3D%2241%22%20y%3D%2214%22%20width%3D%228%22%20height%3D%2237%22%20rx%3D%221.5%22%20fill%3D%22%238C6D46%22%2F%3E%3Cline%20x1%3D%2213%22%20y1%3D%2253%22%20x2%3D%2251%22%20y2%3D%2253%22%20stroke%3D%22%23F6F4EF%22%20stroke-opacity%3D%220.35%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    
    <!-- Google Fonts: Inter & Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                sans: ['Inter', 'system-ui', 'sans-serif'],
                mono: ['"JetBrains Mono"', 'monospace'],
              },
              colors: {
                nordic: {
                  dark: '#0D1F18',
                  card: '#18221E',
                  parchment: '#F6F4EF',
                  sand: '#EDE8DF',
                  brass: '#8C6D46',
                  gold: '#C5A059',
                  muted: '#B5AEA0',
                },
              },
            },
          },
        };
      }
    </script>

    <style>
      /* 
       * Responsive Screen Adaptation & Viewport Density:
       * - On desktop monitors (width >= 1600px & height >= 960px), 16px root font gives comfortable spaciousness.
       * - On laptop screens (13"–16", width 1024px–1536px, or height <= 900px due to OS scaling/toolbars), 
       *   scaling root font-size to 14px (or 13.5px on compact laptops) automatically compacts all Tailwind 
       *   rem-based elements (typography, card padding, gaps, table cell heights, modal bounds), eliminating
       *   the "zoomed-in" feel and keeping tables and forms beautifully in view without excessive scrolling.
       */
      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
        text-rendering: optimizeLegibility;
        scroll-behavior: smooth;
        transition: font-size 0.2s ease-in-out;
      }

      /* Laptop & compact desktop viewports (13"–16" laptops, high DPI scaled displays) */
      @media screen and (min-width: 1024px) and (max-width: 1560px),
             screen and (min-width: 1024px) and (max-height: 960px) {
        html:not([data-density="comfortable"]) {
          font-size: 12.6px;
        }
      }

      /* Compact / 13-inch laptops (e.g., 1366x768, 1280x800, or 150% Windows display scaling) */
      @media screen and (min-width: 1024px) and (max-width: 1366px),
             screen and (min-width: 1024px) and (max-height: 820px) {
        html:not([data-density="comfortable"]) {
          font-size: 12.2px;
        }
      }

      /* Manual user density overrides */
      html[data-density="compact"] {
        font-size: 12.6px !important;
      }
      html[data-density="comfortable"] {
        font-size: 16px !important;
      }

      /* Tablet & mobile viewports: preserve touch readability */
      @media screen and (max-width: 1023px) {
        html:not([data-density="compact"]) {
          font-size: 15px;
        }
      }

      body {
        margin: 0;
        background-color: #F6F4EF;
        color: #15233E;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      @media print {
        html {
          font-size: 12pt !important;
        }
        body {
          background-color: #ffffff !important;
          color: #111827 !important;
        }
      }
    </style>

    <!-- On-screen Startup Diagnostic Listener -->
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;

        var isScriptLoadError = event.target && event.target.tagName === 'SCRIPT';
        var src = isScriptLoadError ? event.target.src : (event.filename || '');
        var isTsx = src && src.indexOf('.tsx') !== -1;

        var msg = isTsx
          ? 'GitHub Pages is currently serving raw uncompiled TypeScript (' + src + ') because Source is set to "Deploy from a branch" instead of "GitHub Actions".'
          : (event.message || event.error || 'Failed to initialize script');

        root.innerHTML =
          '<div style="max-width: 620px; margin: 3rem auto; padding: 2rem; background: #18221E; color: #FCFBF9; border: 1px solid #8C6D46; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); font-family: Inter, system-ui, sans-serif;">' +
          '<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">' +
          '<span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #EF4444;"></span>' +
          '<h2 style="margin: 0; font-size: 18px; color: #FCFBF9; font-weight: 600;">NordicCap Startup Notice</h2>' +
          '</div>' +
          '<p style="color: #D8D1C3; font-size: 13px; line-height: 1.5; margin: 0 0 12px 0;">' + msg + '</p>' +
          (isTsx
            ? '<div style="background: #0D1F18; padding: 12px; border-radius: 6px; border: 1px solid #8C6D46/40; font-size: 12px; color: #D8B98E; line-height: 1.6;">' +
              '<strong>How to resolve:</strong><br/>' +
              '1. Go to your GitHub repo &rarr; <strong>Settings</strong> &rarr; <strong>Pages</strong>.<br/>' +
              '2. Change <strong>Source</strong> from <em>Deploy from a branch</em> to <strong>GitHub Actions</strong>.<br/>' +
              '3. Push changes or trigger the workflow under the <strong>Actions</strong> tab.' +
              '</div>'
            : '<pre style="background: #0D1F18; padding: 10px; border-radius: 6px; color: #FCA5A5; font-size: 11px; overflow-x: auto; margin: 0;">' + (event.error ? event.error.stack || event.error : msg) + '</pre>') +
          '</div>';
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center; color: #15233E;">
        <h2>JavaScript Required</h2>
        <p>NordicCap requires JavaScript to run the equity waterfall engine.</p>
      </div>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
